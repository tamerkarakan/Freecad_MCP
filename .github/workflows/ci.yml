name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Runs on Linux so the safe_source_path symlink-escape test actually executes
    # (it self-skips on Windows without symlink privilege).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mcp

      - name: Compile all sources
        run: python -m compileall -q server.py scripts src tests freecad_workbench

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          FREECAD_MCP_WORKSPACE_ROOT: ${{ github.workspace }}
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Export MCP tool schemas
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/export_mcp_tool_schemas.py

      - name: Static MCP stdio smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          FREECAD_MCP_WORKSPACE_ROOT: ${{ github.workspace }}
        run: python scripts/smoke_static_mcp.py

      - name: Assert symlink-escape test ran (not skipped) on Linux
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          FREECAD_MCP_WORKSPACE_ROOT: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import io, unittest
          from tests.unit.test_static_tools import SafeSourcePathTests
          suite = unittest.TestLoader().loadTestsFromName(
              "test_rejects_symlink_escape", SafeSourcePathTests
          )
          result = unittest.TextTestRunner(stream=io.StringIO()).run(suite)
          assert result.testsRun == 1, "symlink test did not run"
          assert not result.skipped, f"symlink test skipped on Linux: {result.skipped}"
          assert result.wasSuccessful(), "symlink test failed"
          print("symlink-escape test executed and passed on Linux")
          PY
